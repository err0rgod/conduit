<!doctype html>
<html>
  <head>
    <title>Conduit Extension</title>
    <style>
      body {
        font-family: sans-serif;
        width: 250px;
        padding: 10px;
      }
      .form-group {
        margin-bottom: 10px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 5px;
      }
      button {
        width: 100%;
        padding: 8px;
        background: #0366d6;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <h3>Conduit Settings</h3>
    <div class="form-group">
      <label>Daemon Port</label>
      <input type="number" id="port" value="9222" />
    </div>
    <div class="form-group">
      <label>Pairing Code</label>
      <input
        type="text"
        id="code"
        maxlength="12"
        autocomplete="off"
        placeholder="12-character code"
      />
    </div>
    <button id="save">Pair & Connect</button>
    <p id="status">Run <code>conduit extension pair</code> to create a one-use code.</p>

    <script src="popup.js"></script>
  </body>
</html>

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tagged backend
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Checkout compatible extension
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: err0rgod/conduit-extension
          ref: fbf4c824817d92b572f1d1b78e17a75daa17ee50
          path: conduit-extension
      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Verify release version
        run: |
          version="$(node scripts/release-check.js "$RELEASE_TAG")"
          extension_version="$(node -p "require('./conduit-extension/package.json').version")"
          test "$extension_version" = "$version"
      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install extension dependencies
        working-directory: conduit-extension
        run: pnpm install --frozen-lockfile
      - name: Validate backend
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm distribution:test
      - name: Validate and build extension
        working-directory: conduit-extension
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Build release assets
        run: |
          pnpm distribution:pack
          version="$(node scripts/release-check.js "$RELEASE_TAG")"
          (cd conduit-extension/apps/extension/dist && zip -qr "$GITHUB_WORKSPACE/artifacts/conduit-extension-$version.zip" .)
          cp scripts/install.sh scripts/install.ps1 artifacts/
          node scripts/write-checksums.js artifacts/SHA256SUMS \
            artifacts/conduit-browser-$version.tgz \
            artifacts/conduit-extension-$version.zip \
            artifacts/install.sh \
            artifacts/install.ps1
      - name: Upload immutable build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conduit-${{ env.RELEASE_TAG }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Conduit $RELEASE_TAG"
